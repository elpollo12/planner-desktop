[package]
name = "license_gen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "license_gen"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
