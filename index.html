<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/faviconV2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planner</title>
  </head>

  <body>
    <div id="root">
      <style>
        .app-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: #f8fafc;
          gap: 16px;
        }
        @media (prefers-color-scheme: dark) {
          .app-loader { background: #0f172a; }
          .app-loader span { color: #94a3b8; }
        }
        .app-loader .spinner-wrapper {
          position: relative;
          width: 64px;
          height: 64px;
        }
        .app-loader .spinner-ring {
          width: 64px;
          height: 64px;
          border: 3px solid #e2e8f0;
          border-top-color: #1e3a5f;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        .app-loader .spinner-icon {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 36px;
          height: 36px;
          border-radius: 8px;
        }
        @media (prefers-color-scheme: dark) {
          .app-loader .spinner-ring {
            border-color: #334155;
            border-top-color: #60a5fa;
          }
        }
        .app-loader span {
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 14px;
          color: #64748b;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="app-loader">
        <div class="spinner-wrapper">
          <div class="spinner-ring"></div>
          <img src="/faviconV2.png" alt="" class="spinner-icon" />
        </div>
        <span>Cargando...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
