name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

env:
  PUBLIC_REPO: elpollo12/planner-desktop-releases

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Find build artifacts
        id: artifacts
        shell: powershell
        run: |
          $bundleDir = "src-tauri\target\release\bundle\nsis"

          echo "=== Bundle contents ==="
          Get-ChildItem -Path $bundleDir -Recurse | ForEach-Object { echo $_.FullName }

          $exe = Get-ChildItem -Path $bundleDir -Filter "*.exe" | Where-Object { $_.Name -notlike "*.sig" } | Select-Object -First 1
          $sig = Get-ChildItem -Path $bundleDir -Filter "*.exe.sig" | Select-Object -First 1

          echo "EXE: $($exe.FullName)"
          echo "SIG: $($sig.FullName)"

          if (-not $exe -or -not $sig) {
            echo "ERROR: Missing artifacts!"
            exit 1
          }

          echo "nsis_exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "nsis_sig=$($sig.FullName)" >> $env:GITHUB_OUTPUT
          echo "nsis_exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Read signature and get version
        id: meta
        shell: powershell
        run: |
          $sig = Get-Content "${{ steps.artifacts.outputs.nsis_sig }}" -Raw
          $sig = $sig.Trim()
          echo "signature=$sig" >> $env:GITHUB_OUTPUT

          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          echo "pub_date=$pubDate" >> $env:GITHUB_OUTPUT

      - name: Generate latest.json
        shell: powershell
        run: |
          $json = @{
            version = "${{ steps.meta.outputs.version }}"
            notes = "Actualización a versión ${{ steps.meta.outputs.version }}"
            pub_date = "${{ steps.meta.outputs.pub_date }}"
            platforms = @{
              "windows-x86_64" = @{
                signature = "${{ steps.meta.outputs.signature }}"
                url = "https://github.com/${{ env.PUBLIC_REPO }}/releases/download/${{ github.ref_name }}/${{ steps.artifacts.outputs.nsis_exe_name }}"
              }
            }
          } | ConvertTo-Json -Depth 3

          [System.IO.File]::WriteAllText("latest.json", $json)
          echo "=== latest.json ==="
          Get-Content "latest.json"

      - name: Publish to public releases repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.meta.outputs.version }}"

          gh release create "$TAG" \
            --repo "${{ env.PUBLIC_REPO }}" \
            --title "Planner $VERSION" \
            --notes "Actualización a versión $VERSION" \
            "${{ steps.artifacts.outputs.nsis_exe }}" \
            "${{ steps.artifacts.outputs.nsis_sig }}" \
            "latest.json"
