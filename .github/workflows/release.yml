name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

env:
  PUBLIC_REPO: elpollo12/planner-desktop-releases

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Find build artifacts
        id: artifacts
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle/nsis"
          
          echo "=== Bundle contents ==="
          ls -la "$BUNDLE_DIR"
          
          EXE_FILE=$(find "$BUNDLE_DIR" -maxdepth 1 -name "*.exe" ! -name "*.sig" | head -1)
          SIG_FILE=$(find "$BUNDLE_DIR" -maxdepth 1 -name "*.exe.sig" | head -1)
          
          if [ -z "$EXE_FILE" ] || [ -z "$SIG_FILE" ]; then
            echo "ERROR: Missing artifacts!"
            exit 1
          fi
          
          EXE_NAME=$(basename "$EXE_FILE")
          EXE_SIZE=$(stat -c%s "$EXE_FILE" 2>/dev/null || stat -f%z "$EXE_FILE")
          
          echo "nsis_exe=$EXE_FILE" >> $GITHUB_OUTPUT
          echo "nsis_sig=$SIG_FILE" >> $GITHUB_OUTPUT
          echo "nsis_exe_name=$EXE_NAME" >> $GITHUB_OUTPUT
          echo "nsis_size=$EXE_SIZE" >> $GITHUB_OUTPUT

      - name: Read signature and get version
        id: meta
        shell: bash
        run: |
          SIGNATURE=$(cat "${{ steps.artifacts.outputs.nsis_sig }}" | tr -d '\n\r')
          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
          
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "pub_date=$PUB_DATE" >> $GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            ${{ steps.artifacts.outputs.nsis_exe }}
            ${{ steps.artifacts.outputs.nsis_sig }}
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Remove license_gen from build (dev-only tool, not needed in macOS bundle)
        run: rm -f src-tauri/src/bin/license_gen.rs

      - name: Build Tauri app (universal macOS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Find macOS artifacts
        id: mac_artifacts
        run: |
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          echo "=== Bundle contents ==="
          ls -la "$BUNDLE_DIR"

          DMG_FILE=$(find "$BUNDLE_DIR" -maxdepth 1 -name "*.dmg" ! -name "*.sig" | head -1)
          SIG_FILE=$(find "$BUNDLE_DIR" -maxdepth 1 -name "*.dmg.sig" | head -1)

          if [ -z "$DMG_FILE" ] || [ -z "$SIG_FILE" ]; then
            echo "ERROR: Missing macOS artifacts!"
            exit 1
          fi

          DMG_NAME=$(basename "$DMG_FILE")
          echo "dmg=$DMG_FILE" >> $GITHUB_OUTPUT
          echo "dmg_sig=$SIG_FILE" >> $GITHUB_OUTPUT
          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT

      - name: Read macOS signature
        id: mac_meta
        run: |
          SIGNATURE=$(cat "${{ steps.mac_artifacts.outputs.dmg_sig }}" | tr -d '\n\r')
          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "pub_date=$PUB_DATE" >> $GITHUB_OUTPUT

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            ${{ steps.mac_artifacts.outputs.dmg }}
            ${{ steps.mac_artifacts.outputs.dmg_sig }}
          retention-days: 1

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: ./windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: ./macos

      - name: Get version and tag
        id: meta
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "pub_date=$PUB_DATE" >> $GITHUB_OUTPUT

      - name: Read signatures
        id: sigs
        run: |
          WIN_SIG=$(cat windows/*.exe.sig | tr -d '\n\r')
          MAC_SIG=$(cat macos/*.dmg.sig | tr -d '\n\r')
          WIN_NAME=$(ls windows/*.exe | head -1 | xargs basename)
          MAC_NAME=$(ls macos/*.dmg | head -1 | xargs basename)
          echo "win_sig=$WIN_SIG" >> $GITHUB_OUTPUT
          echo "mac_sig=$MAC_SIG" >> $GITHUB_OUTPUT
          echo "win_name=$WIN_NAME" >> $GITHUB_OUTPUT
          echo "mac_name=$MAC_NAME" >> $GITHUB_OUTPUT

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          PUB_DATE="${{ steps.meta.outputs.pub_date }}"
          TAG="${{ github.ref_name }}"
          WIN_SIG="${{ steps.sigs.outputs.win_sig }}"
          MAC_SIG="${{ steps.sigs.outputs.mac_sig }}"
          WIN_NAME="${{ steps.sigs.outputs.win_name }}"
          MAC_NAME="${{ steps.sigs.outputs.mac_name }}"

          cat > latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "Actualizacion a version ${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "https://github.com/${{ env.PUBLIC_REPO }}/releases/download/${TAG}/${WIN_NAME}"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "https://github.com/${{ env.PUBLIC_REPO }}/releases/download/${TAG}/${MAC_NAME}"
              },
              "darwin-x86_64": {
                "signature": "${MAC_SIG}",
                "url": "https://github.com/${{ env.PUBLIC_REPO }}/releases/download/${TAG}/${MAC_NAME}"
              }
            }
          }
          ENDJSON

          echo "=== latest.json ==="
          cat latest.json

      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.meta.outputs.version }}"

          if gh release view "$TAG" --repo "${{ env.PUBLIC_REPO }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists, deleting..."
            gh release delete "$TAG" --repo "${{ env.PUBLIC_REPO }}" --yes
          fi

          gh release create "$TAG" \
            --repo "${{ env.PUBLIC_REPO }}" \
            --title "Planner $VERSION" \
            --notes "Actualización a versión $VERSION" \
            windows/*.exe \
            windows/*.exe.sig \
            macos/*.dmg \
            macos/*.dmg.sig \
            latest.json

      - name: Notify planner-sync of new release
        if: env.SYNC_SERVER_URL != ''
        env:
          SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
          SYNC_ADMIN_USER: ${{ secrets.SYNC_ADMIN_USER }}
          SYNC_ADMIN_PASS: ${{ secrets.SYNC_ADMIN_PASS }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          WIN_NAME="${{ steps.sigs.outputs.win_name }}"
          PUB_DATE="${{ steps.meta.outputs.pub_date }}"
          WIN_SIG="${{ steps.sigs.outputs.win_sig }}"
          ASSET_URL="https://github.com/${{ env.PUBLIC_REPO }}/releases/download/${{ github.ref_name }}/${WIN_NAME}"

          LOGIN_RESPONSE=$(curl -s -X POST "${SYNC_SERVER_URL}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${SYNC_ADMIN_USER}\", \"password\": \"${SYNC_ADMIN_PASS}\"}")

          TOKEN=$(echo "$LOGIN_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])" 2>/dev/null)

          if [ -z "$TOKEN" ]; then
            echo "⚠️  Login to planner-sync failed — skipping notification"
            exit 0
          fi

          HTTP_STATUS=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
            -X POST "${SYNC_SERVER_URL}/api/v1/updates/releases" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -d "{
              \"version\": \"${VERSION}\",
              \"notes\": \"Actualizacion a version ${VERSION}\",
              \"channel\": \"stable\",
              \"pubDate\": \"${PUB_DATE}\",
              \"assetUrl\": \"${ASSET_URL}\",
              \"assetSignature\": \"${WIN_SIG}\",
              \"assetSize\": 0
            }")

          echo "HTTP Status: ${HTTP_STATUS}"
          cat /tmp/sync_response.json

      - name: Summary
        run: |
          echo "## ✅ Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
