name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

env:
  PUBLIC_REPO: elpollo12/planner-desktop-releases

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Find build artifacts
        id: artifacts
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle/nsis"
          
          echo "=== Bundle contents ==="
          ls -la "$BUNDLE_DIR"
          
          EXE_FILE=$(find "$BUNDLE_DIR" -maxdepth 1 -name "*.exe" ! -name "*.sig" | head -1)
          SIG_FILE=$(find "$BUNDLE_DIR" -maxdepth 1 -name "*.exe.sig" | head -1)
          
          if [ -z "$EXE_FILE" ] || [ -z "$SIG_FILE" ]; then
            echo "ERROR: Missing artifacts!"
            exit 1
          fi
          
          EXE_NAME=$(basename "$EXE_FILE")
          EXE_SIZE=$(stat -c%s "$EXE_FILE" 2>/dev/null || stat -f%z "$EXE_FILE")
          
          echo "nsis_exe=$EXE_FILE" >> $GITHUB_OUTPUT
          echo "nsis_sig=$SIG_FILE" >> $GITHUB_OUTPUT
          echo "nsis_exe_name=$EXE_NAME" >> $GITHUB_OUTPUT
          echo "nsis_size=$EXE_SIZE" >> $GITHUB_OUTPUT

      - name: Read signature and get version
        id: meta
        shell: bash
        run: |
          SIGNATURE=$(cat "${{ steps.artifacts.outputs.nsis_sig }}" | tr -d '\n\r')
          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
          
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "pub_date=$PUB_DATE" >> $GITHUB_OUTPUT

      - name: Generate latest.json
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SIGNATURE="${{ steps.meta.outputs.signature }}"
          EXE_NAME="${{ steps.artifacts.outputs.nsis_exe_name }}"
          PUB_DATE="${{ steps.meta.outputs.pub_date }}"
          TAG="${{ github.ref_name }}"

          cat > latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "Actualizacion a version ${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "https://github.com/${{ env.PUBLIC_REPO }}/releases/download/${TAG}/${EXE_NAME}"
              }
            }
          }
          ENDJSON

          echo "=== latest.json ==="
          cat latest.json

      - name: Publish to public releases repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.meta.outputs.version }}"
          
          echo "=== Debug info ==="
          echo "Token length: ${#GH_TOKEN}"
          gh auth status || echo "Auth status failed"
          
          echo "=== Checking repo access ==="
          gh repo view "${{ env.PUBLIC_REPO }}" --json name || echo "Cannot access repo"
          
          if gh release view "$TAG" --repo "${{ env.PUBLIC_REPO }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists, deleting..."
            gh release delete "$TAG" --repo "${{ env.PUBLIC_REPO }}" --yes || echo "Failed to delete"
          fi
          
          echo "=== Creating release ==="
          gh release create "$TAG" \
            --repo "${{ env.PUBLIC_REPO }}" \
            --title "Planner $VERSION" \
            --notes "Actualización a versión $VERSION" \
            "${{ steps.artifacts.outputs.nsis_exe }}" \
            "${{ steps.artifacts.outputs.nsis_sig }}" \
            "latest.json" 2>&1 || echo "Release create failed with exit code $?"

      - name: Notify planner-sync of new release
        if: env.SYNC_SERVER_URL != ''
        env:
          SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
          SYNC_ADMIN_USER: ${{ secrets.SYNC_ADMIN_USER }}
          SYNC_ADMIN_PASS: ${{ secrets.SYNC_ADMIN_PASS }}
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SIGNATURE="${{ steps.meta.outputs.signature }}"
          EXE_NAME="${{ steps.artifacts.outputs.nsis_exe_name }}"
          EXE_SIZE="${{ steps.artifacts.outputs.nsis_size }}"
          PUB_DATE="${{ steps.meta.outputs.pub_date }}"
          ASSET_URL="https://github.com/${{ env.PUBLIC_REPO }}/releases/download/${{ github.ref_name }}/${EXE_NAME}"

          echo "=== Logging in to planner-sync ==="
          LOGIN_RESPONSE=$(curl -s -X POST "${SYNC_SERVER_URL}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${SYNC_ADMIN_USER}\", \"password\": \"${SYNC_ADMIN_PASS}\"}")

          TOKEN=$(echo "$LOGIN_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])" 2>/dev/null)

          if [ -z "$TOKEN" ]; then
            echo "⚠️  Login to planner-sync failed — skipping notification"
            echo "Response: $LOGIN_RESPONSE"
            exit 0
          fi

          echo "=== Notifying planner-sync at ${SYNC_SERVER_URL} ==="
          HTTP_STATUS=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
            -X POST "${SYNC_SERVER_URL}/api/v1/updates/releases" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -d "{
              \"version\": \"${VERSION}\",
              \"notes\": \"Actualizacion a version ${VERSION}\",
              \"channel\": \"stable\",
              \"pubDate\": \"${PUB_DATE}\",
              \"assetUrl\": \"${ASSET_URL}\",
              \"assetSignature\": \"${SIGNATURE}\",
              \"assetSize\": ${EXE_SIZE}
            }")

          echo "HTTP Status: ${HTTP_STATUS}"
          cat /tmp/sync_response.json

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ planner-sync notified successfully"
          else
            echo "⚠️  planner-sync notification failed (non-blocking)"
          fi

      - name: Summary
        run: |
          echo "## ✅ Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
